name: eduinclusiva_ia
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  provider: ^6.1.5+1
  flutter_tts: ^4.2.5
  file_picker: ^8.3.7
  google_fonts: ^6.1.0
  http: ^1.6.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  flutter_3d_controller: ^1.3.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  pdf: ^3.10.8
  printing: ^5.11.1
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon_star.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/